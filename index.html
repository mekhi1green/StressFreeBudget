<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/StressFreeBudget/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1F2833" />
    <meta name="color-scheme" content="light dark" />
    <title>StressFreeBudget</title>
    <script>
      // Apply the saved theme before first paint so there is no light/dark flash.
      ;(function () {
        try {
          var pref = localStorage.getItem('sfb-theme') || 'system'
          var dark =
            pref === 'dark' || (pref === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.classList.toggle('dark', dark)
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute('content', dark ? '#1F2833' : '#EADFCE')
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
